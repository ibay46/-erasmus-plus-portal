<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .canvas {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: linear-gradient(
      to bottom,
      #3a0a14 0%,
      #6e1418 22%,
      #a52e1c 42%,
      #d9692c 58%,
      #f0a64a 68%,
      #1c2638 80%,
      #0a0e16 100%
    );
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 76px;
    color: #f3f4f7;
    overflow: hidden;
  }
  .sun-glow {
    position: absolute;
    left: 50%;
    top: 56%;
    width: 700px;
    height: 700px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,214,140,0.55) 0%, rgba(255,160,80,0.0) 70%);
  }
  .landmark-wrap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 640px;
    overflow: hidden;
  }
  .landmark-wrap svg {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 1080px;
    height: 640px;
  }
  .reflection-wrap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -10px;
    height: 220px;
    overflow: hidden;
    opacity: 0.28;
  }
  .reflection-wrap svg {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%) scaleY(-1);
    width: 1080px;
    height: 640px;
  }
  .water-fade {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 230px;
    background: linear-gradient(to top, #0a0e16 10%, rgba(10,14,22,0.55) 55%, rgba(10,14,22,0) 100%);
  }
  .top-fade {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 260px;
    background: linear-gradient(to bottom, rgba(20,5,10,0.55) 0%, rgba(20,5,10,0) 100%);
  }
  .top-row {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    background: {{BADGE_COLOR}};
    color: #ffffff;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 14px 28px;
    border-radius: 999px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0.95;
  }
  .brand img { width: 44px; height: 44px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)); }
  .brand span { font-size: 26px; font-weight: 600; color: #f3e9e2; }

  .middle {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .title {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.18;
    letter-spacing: -0.01em;
    color: #ffffff;
    text-shadow: 0 2px 16px rgba(0,0,0,0.45);
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .excerpt {
    font-size: 32px;
    line-height: 1.5;
    color: #f1e3d8;
    text-shadow: 0 1px 10px rgba(0,0,0,0.4);
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .bottom-row {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 2px solid rgba(255,255,255,0.18);
    padding-top: 28px;
  }
  .website {
    font-size: 28px;
    font-weight: 700;
    color: #ffffff;
  }
  .tag {
    font-size: 24px;
    color: #cdd2da;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="sun-glow"></div>
    <div class="reflection-wrap">{{LANDMARK_SVG}}</div>
    <div class="landmark-wrap">{{LANDMARK_SVG}}</div>
    <div class="water-fade"></div>
    <div class="top-fade"></div>

    <div class="top-row">
      <span class="badge">{{CATEGORY}}</span>
      <div class="brand">
        <img src="{{LOGO}}" alt="" />
        <span>Erasmus+ Portal</span>
      </div>
    </div>

    <div class="middle">
      <div class="title">{{TITLE}}</div>
      <div class="excerpt">{{EXCERPT}}</div>
    </div>

    <div class="bottom-row">
      <span class="website">erasmusportal.com</span>
      <span class="tag">{{DATE}}</span>
    </div>
  </div>
</body>
</html>
